#!/usr/bin/env python3
# Codex writes its own state (project trust, TUI flags) to this file, so only
# the top-level keys below are managed; everything else is passed through.
import re
import sys

MANAGED = {
    "model_reasoning_effort": '"medium"',
    "approvals_reviewer": '"auto_review"',
}

lines = sys.stdin.read().splitlines()
out = [f"{k} = {v}" for k, v in MANAGED.items()]
in_table = False
for line in lines:
    if line.lstrip().startswith("["):
        in_table = True
    m = re.match(r"\s*([A-Za-z0-9_-]+)\s*=", line)
    if not in_table and m and m.group(1) in MANAGED:
        continue
    out.append(line)
print("\n".join(out))
