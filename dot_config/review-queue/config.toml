auto_clone = true
auto_workspace = true

[source.moz-phab]
url = "https://phabricator.services.mozilla.com"

[source.github]
ignore_repos = ["mozilla/webservices-infra"]

[targets.tmux]
description = "Open in tmux session"
key = "t"
wait = false
command = '''
summary=$(cd "$RQ_WORKSPACE" && { jj log --ignore-working-copy --no-graph -r '@-' -T 'description.first_line()' 2>/dev/null || git log -1 --format=%s 2>/dev/null; })
summary=$(printf %s "$summary" | sed 's/ r[=?].*//' | cut -c1-60)
s="rq-$(printf %s "$RQ_REVIEW${summary:+ | $summary}" | tr './:' '___')"
layout="$HOME/.local/bin/tmux-layout"
if [ -z "$TMUX" ]; then
  tmux has-session -t "=$s" 2>/dev/null || {
    tmux new-session -ds "$s" -c "$RQ_WORKSPACE"
    "$layout" "$s" "$RQ_WORKSPACE"
  }
  exec tmux attach-session -t "=$s"
fi
tmux has-session -t "=$s" 2>/dev/null || {
  tmux new-session -ds "$s" -c "$RQ_WORKSPACE"
  tmux set-option -t "$s" detach-on-destroy previous
  "$layout" "$s" "$RQ_WORKSPACE"
}
tmux switch-client -t "=$s"
while tmux has-session -t "=$s" 2>/dev/null; do sleep 1; done
'''

[targets.lrv]
description = "Open in lrv"
command = '''
# Bound by the workspace's pinned tip bookmark so the whole stack shows even
# when the workspace is positioned on a lower revision.
name="${RQ_WORKSPACE#*/review-queue/workspaces/}"
if jj root --ignore-working-copy >/dev/null 2>&1; then
  exec lrv --series "trunk()..(@-:: & bookmarks(glob:\"review-queue/$name/*\"))"
fi
# Git worktree: pins are refs/review-queue/<name>/<version>; take the newest one
# descending from HEAD.
tip=$(git for-each-ref --contains HEAD --sort=-committerdate --count=1 \
  --format='%(objectname)' "refs/review-queue/$name/")
exec lrv --series "origin/HEAD..${tip:-HEAD}"
'''
key = "v"

[targets.workspace]
description = "Open in workspace"
command = 'tmux display-popup -E -B -w 100% -h 100% -d "$RQ_WORKSPACE"'
key = "w"
wait = false
