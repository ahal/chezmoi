open_command = '''
summary=$(cd "$RQ_WORKSPACE" && { jj log --ignore-working-copy --no-graph -r '@-' -T 'description.first_line()' 2>/dev/null || git log -1 --format=%s 2>/dev/null; })
summary=$(printf %s "$summary" | sed 's/ r[=?].*//' | cut -c1-60)
s="rq-$(printf %s "$RQ_REVIEW${summary:+ | $summary}" | tr './:' '___')"
layout="$HOME/.local/bin/tmux-layout"
if [ -z "$TMUX" ]; then
  tmux has-session -t "=$s" 2>/dev/null || {
    tmux new-session -ds "$s" -c "$RQ_WORKSPACE"
    "$layout" "$s" "$RQ_WORKSPACE"
  }
  exec tmux attach-session -t "=$s"
fi
tmux has-session -t "=$s" 2>/dev/null || {
  tmux new-session -ds "$s" -c "$RQ_WORKSPACE"
  tmux set-option -t "$s" detach-on-destroy previous
  "$layout" "$s" "$RQ_WORKSPACE"
}
tmux switch-client -t "=$s"
while tmux has-session -t "=$s" 2>/dev/null; do sleep 1; done
'''
open_command_wait = false

workdir = "~/dev"

[source.moz-phab]
url = "https://phabricator.services.mozilla.com"

[source.github]
